[project]
name = "policypath"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "databento>=0.86.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policypath"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # used by config/meetings/pull_fomc.py, which does not run in the test suite
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
