[project]
name = "policypath"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "databento>=0.86.0",
    "matplotlib>=3.10",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
    "quantlib==1.42.1",
    "requests>=2.34.2",
]

[project.scripts]
# `uv run all`: every report from the cache, in order (src/policypath/run_all.py)
all = "policypath.run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policypath"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # used by src/policypath/sources/pull_fomc.py, which does not run in the test suite
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
