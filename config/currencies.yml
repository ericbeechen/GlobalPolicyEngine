# Currency-specific behaviour. Modules read this; they never branch on currency.
# Adding a currency should need only a block here, a meetings file, and a source
# module if its data comes from a provider sources/ does not have yet.
#
# config.py validates every enabled block when this file is loaded (config.SCHEMA):
# a missing or mistyped field fails there, naming it, not as a KeyError three
# modules later. A block with enabled: false is a draft and is not checked.
#
# A value that changed inside the sample is a dated schedule, resolved for a date
# by model.reaction.on:  [{from: "2009-01-01", value: 0.5}, {from: "2016-08-04", value: 0.1}]

USD:
  enabled: true
  meetings: fomc.csv            # under config/meetings/
  history_start: "2010-01-01"   # first fixing pulled into the cache: before the first ZQ session

  calendar: fed                 # business days: calendars.BDAYS

  # The overnight rate the market path is in, and whose fixings are substituted.
  overnight:
    source: fred
    series: EFFR
    day_count: 360              # Act/360: a day's fixing accrues 1/360, as a funded leg pays it
  # Where the market path comes from: market.EXTRACTORS. ZQ settles on the
  # calendar-month average of EFFR, so the path is a least-squares solve.
  market:
    extractor: futures_strip
    label: ZQ futures             # names the source in figures and the brief
    overnight_label: EFFR
    figure_note: "Its 2015-17 notches are real: EFFR printed 5-12bp low on the last day of most months."
    futures: {source: databento, series: ZQ}   # the monthly-average futures it is solved from
    # A session's settles as they stood this many business days after it: CME's
    # final settle arrives that evening, or on the Sunday for a Friday session.
    final_after_bdays: 1
    # Where the exchange is shut on a day the Fed is open (calendars.EXCHANGES): the
    # coverage report names those days rather than counting them as gaps.
    exchange_calendar: cme
    exchange: CME
    tags:
      calendar:
        lag: "scheduled FOMC dates are treated as known on every date (fomc.csv records no publication date)"

  # Everything update_data.py keeps cached, by source (sources/registry.py).
  sources:
    # Daily series: Fed business days from a value's date to when it is public. The
    # NY Fed publishes EFFR and SOFR the next morning; the target range in force on
    # day d is announced before d starts; an SEP median is dated on its release day.
    # H.15's Treasury par yields (DGS*), Moody's Baa and Aaa less the 10y (BAA10Y,
    # AAA10Y) and ICE BofA's IG and HY OAS (BAML*) are out the next business day.
    # See notes/DECISIONS.md.
    daily:
      fred: {EFFR: 1, SOFR: 1, DFEDTARL: 0, DFEDTARU: 0, FEDTARMDLR: 0,
             DGS1: 1, DGS2: 1, DGS3: 1, DGS5: 1, DGS7: 1, DGS10: 1, DGS30: 1,
             BAA10Y: 1, AAA10Y: 1, BAMLC0A0CM: 1, BAMLH0A0HYM2: 1}
    futures:
      databento: [ZQ, SR1, SR3]
    # Quarterly estimates: calendar days from the end of a vintage's quarter to its
    # release. HLW r*, one real-time vintage a quarter (sources/nyfed.py): the
    # robustness r*, never the model's own. 65 is the latest on-schedule HLW release
    # (2019Q2 on 2019-09-03); HLW follows Canada's GDP, not LW's US one.
    estimates:
      nyfed: {HLW_RSTAR: 65}
    # Pulled whole with every ALFRED vintage, outside the nowcast. FEDTARMD is the SEP
    # median funds rate at each year end, a vintage per SEP from 2015-12-16: the
    # projected-path variant's reference (rule.projected), never the model's own.
    vintages:
      alfred: [FEDTARMD]
    tags:
      HLW_RSTAR:
        lag: "an HLW r* vintage is known 65 days after its quarter (HLW's schedules run 58-65), or from its release day where that came later (2022Q4, 2025Q3, 2025Q4)"
        quality: "HLW's real-time vintages start with 2015Q4, known 2016-03-05, so the 1,267 USD model sessions before it have none; there are none 2020Q3-2022Q3, and the 2020Q2 estimate, 0.03% against 0.53% for 2020Q1, stands through the gap (683 sessions, to 2023-05-18)"
  # What each root settles to (curves/futures.py): the calendar-month average
  # of its overnight rate, or SOFR compounded over the IMM quarter.
  contract_shapes: {ZQ: month, SR1: month, SR3: imm_quarter}
  # First session a root really traded, where the archive starts earlier. CME sent
  # reference settles for SR1's whole strip on 2018-04-20, 04-27 and 05-04, before
  # its first trade on the evening of Sunday 2018-05-06. They stay in the cache as
  # published; nothing downstream reads them as a market.
  first_sessions: {SR1: "2018-05-07"}

  path:
    start: "2010-06-07"         # first session in the panel: the first ZQ session in the archive
    n_meetings: 8               # solve and report this many upcoming meetings
    # Both chosen from the full panel; see notes/DECISIONS.md (2026-09-24).
    # Pin today-until-the-next-meeting to the last fixing when it spans fewer
    # days than this: below 10, one contract's noise is amplified more than 3x.
    min_regime_days: 10
    # Drop the front contract when it has fewer unknown days left than this.
    # 0 = never: once short regimes are pinned, dropping it gains nothing, and
    # without pinning it only moved the amplification into the next contract.
    min_forward_days: 0
    tail_days: 45               # unused by a futures strip: a whole contract past the last meeting closes it

  # Secondary overnight index: the discount curve and the cross-check of the ZQ path.
  sofr:
    source: fred
    series: SOFR
    futures: SR3                # the discount curve: SR1 lists only ~13 months out
    crosscheck: SR1             # monthly average like ZQ, so the basis is read month by month
    day_count: Actual360
    curve_years: 3              # SR3 contracts used out to this many years

  # Real-time macro inputs. Every series is pulled with its full ALFRED vintage
  # history; reports/vintages_USD.md says what each one covers.
  macro:
    source: alfred
    history_start: "1990-01-01"   # reference dates pulled: moments and bridge fits need history
    series: [PAYEMS, INDPRO, RSAFS, CPIAUCSL, NEWORDER, UNRATE, NROU,
             PCEPILFE, CPILFESL, CES0500000003]
    validation: [CPILFENS, GDPNOW, UNRATEMDLR]   # pulled and tested, never a nowcast input
    projections: [NROU]           # published ahead of the dates they describe
    # First as_of the nowcast panel is built for: the first day every input has a
    # vintage. NROU's first is 2011-02-02, average hourly earnings' 2011-03-04.
    start: "2011-03-04"
    inflation:
      target: PCEPILFE            # what the rule reacts to
      bridge: CPILFESL            # prints ~2 weeks earlier; stands in until the target arrives
      bridge_window: 60           # months of overlap the bridge is fitted on
      wages: CES0500000003
    gap:
      unemployment: UNRATE
      natural_rate: NROU          # CBO, vintaged; see notes/DECISIONS.md
      longer_run: UNRATEMDLR      # FOMC SEP median: reported as a sensitivity, never the input
    activity:
      series: [PAYEMS, INDPRO, RSAFS, NEWORDER]   # first sets the quarter: it prints first
      deflate: {RSAFS: CPIAUCSL}  # real retail sales built as-of, not FRED's RRSFS
      moments_start: "1993-01-01" # NEWORDER starts 1992-02; first complete q/q is 1993Q1
      min_series: 3
      benchmark: GDPNOW           # validation only: the composite is correlated with it, never fitted to it
      # GDPNow's 2025Q1 moved on gold imports none of the four series sees: shown with and without it.
      benchmark_exclude: "2025-01-01"
    tags:
      PCEPILFE:
        lag: "core PCE's latest one or two months are bridged from core CPI until PCE prints (real-time RMSE 0.075pp m/m)"
      NROU:
        lag: "CBO's natural rate has vintages only from 2011-02-02, so the model path starts 2011-03-04"

  # The model path: the Fed's own balanced-approach rule from the Monetary Policy
  # Report, in its inertial form. Imposed, not estimated; an estimated rule is a
  # different block. See notes/DECISIONS.md (2026-09-27).
  #   notional  R* = r* + pi + a (pi - pi*) + b (u* - u)
  #   path      R_k = rho R_(k-1) + (1 - rho) max(elb, R*),  R_0 = the range in force
  # Conditioning is hold-flat: pi, u - u* and r* stay at their as-of values at every meeting.
  rule:
    # R_0: the policy rate in force on the day. Two series are a range, read at its
    # midpoint; one is a rate. A dated schedule of these where the operative rate changed.
    policy_rate: {source: fred, series: [DFEDTARL, DFEDTARU]}
    inflation: infl_12m                  # nowcast column: 12-month core PCE, percent
    gap: u_gap                           # nowcast column: u - u*, positive = slack
    inflation_target: 2.0
    coefficients: {inflation_gap: 0.5, unemployment_gap: 2.0}   # MPR balanced approach
    inertia: 0.85                        # per quarter, as in the MPR's inertial rule
    meetings_per_quarter: 2              # so 0.85 ** 0.5 = 0.922 per meeting
    elb: 0.125                           # midpoint of 0-0.25: the floor, applied to R*
    # EFFR minus the midpoint, to put the model path on the rate ZQ settles on:
    # the median over the last this-many known fixings, held flat like the macro.
    spread_fixings: 20
    # The NY Fed changed how EFFR is computed on 2016-03-01 (a brokered volume-weighted
    # mean to the FR 2420 volume-weighted median). Not a break: the 20-fixing median of
    # the spread moved from +0.5 to -0.5bp across it (notes/DECISIONS.md, R10).
    spread_breaks: []
    rstar:
      source: fred
      series: FEDTARMDLR                 # FOMC SEP median longer-run funds rate, minus the target
      label: SEP                         # what a new r* comes from, in the reports
      before_first: 2.0                  # Taylor (1993)'s r*, before the first dot (2012-01-25)
      before_first_label: "Taylor's 2%"
    tags:
      conditioning:
        quality: "hold-flat conditioning: inflation, the unemployment gap and r* stay at today's values at every meeting"
      rule:
        quality: "the rule is imposed from the Fed's Monetary Policy Report, not estimated"
      rstar:
        quality: "r* is the SEP median as FRED rounds it (to within 5bp); Taylor's 2% before the first dot, 2012-01-25"

  # Market path minus model path, per meeting horizon.
  signal:
    window: 730D                         # trailing distribution: two years, calendar
    min_periods: 250                     # about a year of sessions before a z exists
    sd_floor_bp: 5                       # at the ELB the gap barely moves; see notes/DECISIONS.md

  # Crude backtest: trade the implied rate after one meeting, no costs (the sleeves' costs are
  # under costs:, charged in strategy/costs.py; the cost tags here say what they rest on).
  backtest:
    horizon: 4                           # the k-th meeting ahead, re-chosen every session
    execution_lag: 1                     # sessions between the signal and the position
    dv01: 1.0                            # P&L in bp per unit of z
    tags:
      costs:
        quality: "USD costs are tick-based, not measured: ZQ at two back-month ticks a round trip plus an assumed $1 a side (1.05bp), the exchange's minimum increment, since the archive has settles and no quotes; the Treasury legs' 0.5bp is assumed"

  # The expression layer: what each expression trades in this currency (strategy/instruments.py names the types).
  expression:
    outright:
      instrument: futures_month      # the ZQ month the k-th meeting's rate settles in
      label: ZQ                      # what the reports call it: "ZQ Apr 2027"
      contract: ZQ                   # the key under contracts (futures_month only)
    curve:
      instrument: par_yield          # Treasury constant-maturity par yields, linear in maturity between tenors
      label: Treasury                # "2y Treasury"
      source: fred
      series: {1: DGS1, 2: DGS2, 3: DGS3, 5: DGS5, 7: DGS7, 10: DGS10}
      legs: [2, 10]                  # receive the first, pay the second, DV01-neutral
      coupons_per_year: 2
    tags:
      par_yield:
        quality: "Treasury legs are H.15 constant-maturity par yields: a fitted curve, not traded bonds"
      marks:
        lag: "34 of 3,921 USD sessions have no Treasury yields (bond market shut, CME open): a leg carries its last print"
      funding:
        modelling: "a par leg is funded at the overnight rate, standing in for repo"
      convexity:
        modelling: "legs are DV01-linear, so the P&L leaves out convexity: under 3bp a year per unit DV01 on a 2s10s receive, 7bp at most (2022)"
  contracts:                         # DV01 is derived from these, never typed.
    ZQ:
      notional: 5000000
      accrual: {days: 30, year_days: 360}   # DV01 = 5,000,000 x 30/360 x 1bp = $41.6667 (CME rounds to $41.67)
      tick: {front: 0.0025, other: 0.005}   # $10.4167 and $20.8333 derived (CME quotes $10.4175, $20.835)
      fee_per_side: 1.0                     # USD a contract, exchange and clearing, assumed
      exchange: CME
      quoted: {dv01: 41.67, tick: {front: 10.4175, other: 20.835}}   # CME's published values, USD: the check on the derived ones
  costs:                             # strategy/costs.py: round trip per leg and unit of DV01 traded
    outright: {ticks_round_trip: 2, observed: true}      # two back-month ticks (1bp) + fee_per_side twice: 1.048bp, derived
    curve: {round_trip_bp: 0.5, observed: false, roll_every_months: 3}   # assumed; a held leg is re-struck quarterly
    tags:
      outright:
        modelling: "a ZQ position rolls to the next month each time the fourth meeting moves on, charged as two outright one-ways, not as a (tighter) calendar spread"
      curve:
        modelling: "a Treasury leg's P&L is a constant-maturity bond re-struck daily; the cost charged is a desk's roll every three months while held"
  # The credit bridge (credit.py). A spread is the sum of its legs: long and
  # plus added, short and minus taken off (config.SPREAD_SIGNS).
  credit:
    primary: quality                 # the spread the bridge leads with
    spreads:
      quality: {long: {source: fred, series: BAA10Y}, short: {source: fred, series: AAA10Y}}   # Baa - Aaa: maturity-matched
      baa_30y: {long: {source: fred, series: BAA10Y}, plus: {source: fred, series: DGS10},
                minus: {source: fred, series: DGS30}}                                        # Baa - 30y Treasury
      baa_10y: {long: {source: fred, series: BAA10Y}}                                        # Baa - 10y Treasury
    control: {long: {source: fred, series: DGS30}, short: {source: fred, series: DGS10}}      # the Treasury 10s30s
    crosscheck: {ig_oas: {source: fred, series: BAMLC0A0CM}, hy_oas: {source: fred, series: BAMLH0A0HYM2}}
    # The yield a stale seasoned-bond quote would trail: the staleness check and its control (DECISIONS D2).
    staleness: {source: fred, series: DGS10}
    # Weekly = the last print on or before each of these (the Fed's week: H.4.1 and H.8 are Wednesday-dated).
    week_ends: Wednesday
    # Tests 1 and 2 are also run without each window (every change that touches it is left out).
    exclude: {crash_2020: ["2020-02-15", "2020-04-30"]}
    # What the report and chart call each spread, the control and the staleness yield.
    labels: {quality: "Baa - Aaa", baa_30y: "Baa - 30y Treasury", baa_10y: "Baa - 10y Treasury",
             ig_oas: "ICE BofA IG OAS", hy_oas: "ICE BofA HY OAS", control: "Treasury 10s30s",
             staleness: "10y Treasury yield"}
    tags:
      BAA10Y:
        quality: "Moody's Baa and Aaa are yields on seasoned long-dated bonds, whose quotes can trail the market: the credit bridge checks each spread's weekly changes for staleness before its predictive test, and where the pre-registered check fires those fits control for the 10y's move the week before"
      excess_returns:
        modelling: "the credit bridge reads spread changes as excess returns: duration, carry and the default loss are left out"
      held_meeting:
        modelling: "the credit bridge's level change is for the meeting at the signal's horizon at the start of the week, held, so a meeting passing is not read as a repricing; its slope and differential changes are the signal's own, not held"
      regimes:
        modelling: "cycle regimes are real-time labels from two round thresholds (a year of hikes is early, six months without a move is a pause); two hiking cycles are too few for a nominal-size test of a sign flip"
      BAMLC0A0CM:
        quality: "ICE BofA OAS on FRED start 2023-09-29 (FRED keeps three years): a short cross-check only. 37 prints of each fall on weekends and Fed holidays, most repeating the day before, so a change there is not a market move"

  # Words and moments the generated reports use for this currency.
  report:
    labels: {market: ZQ, rate: EFFR, rule: "Fed's own rule", policy: fed funds, meetings: FOMC, bank: the Fed,
             inflation: Core PCE, policy_rate: Midpoint, nowcast_start: "which needs a vintaged u*",
             calendar: Fed,
             # How the brief names the month an unemployment print is for: UNRATE is one month.
             unemployment_period: "for {month:%B}"}
    onepager: true                       # the original one-page note (report/onepager.py): USD prose throughout
    annotate_from: "2021-12-01"          # the path figure annotates the first monthly path on or after this
    # Days the gap should explain: report/model.py reads each on the first session on or after it.
    moments:
      - ["2011-08-09", "\"Exceptionally low\" through mid-2013: calendar guidance"]
      - ["2013-06-24", "Taper tantrum"]
      - ["2015-06-01", "Liftoff delayed"]
      - ["2015-12-15", "Eve of liftoff"]
      - ["2018-12-20", "Day after the last hike of the cycle"]
      - ["2019-07-30", "Eve of the first insurance cut"]
      - ["2020-06-01", "Both at the floor"]
      - ["2021-11-01", "Late 2021: inflation up, the Fed waits"]
      - ["2022-03-01", "Eve of liftoff, 2022"]
      - ["2022-06-13", "Before the first 75bp hike"]
      - ["2023-06-13", "The pause"]
      - ["2023-12-14", "Pivot debate: the day after the December dots"]
      - ["2024-04-15", "Cuts priced out"]
      - ["2024-09-17", "Eve of the first cut"]
    # Marked on the gap chart where the gap is widest inside each window.
    chart_moments:
      - ["2015-03-01", "2015-09-30", "Liftoff waits"]
      - ["2019-06-01", "2019-10-31", "2019 cuts"]
      - ["2021-10-01", "2022-03-31", "Rule up, Fed waits"]
      - ["2023-10-01", "2024-01-31", "Pivot debate"]
      - ["2024-07-01", "2024-09-30", "Cuts repriced"]


GBP:
  enabled: true
  meetings: mpc.csv             # under config/meetings/
  history_start: "2009-01-01"   # the Bank's OIS curve archive starts 2009-01-02
  calendar: uk                  # England and Wales bank holidays: calendars.UKHolidayCalendar

  # SONIA: the overnight rate the OIS curve discounts on. Not Bank Rate: see rule.spread_*.
  overnight:
    source: boe
    series: IUDSOIA
    day_count: 365              # Act/365: a day's fixing accrues 1/365, as a funded leg pays it
  # The Bank's fitted OIS spot curve, short end (monthly, 1-60 months). There is
  # no monthly-average futures contract to solve, so the path is the forward
  # between consecutive meetings (curves/forward.py).
  market:
    extractor: forward_curve
    # Continuously compounded spot rates by maturity in months, on an Act/365 time axis (SONIA's).
    curve: {source: boe, series: OIS_SPOT, year_days: 365}
    label: the Bank of England's OIS curve
    overnight_label: SONIA
    # Today until the first meeting is always the rate in force: no meeting falls
    # inside it, and reading it off the curve smears the first meeting's step
    # across the monthly node interval it lands in. Measured against the SONIA that
    # then printed, 2009-26: mean absolute error 0.52bp pinned vs 0.84bp read off
    # the curve (MPC days 0.52 vs 1.39; 2022 0.09 vs 3.29). notes/DECISIONS.md.
    pin_first_regime: true
    # The rate in force is the last SONIA fixing moved by any Bank Rate change
    # since: a decision takes effect at noon on the day it is announced, before
    # it is in any published fixing.
    policy_rate: {source: boe, series: IUDBEDR}
    # The Bank publishes a day's curve by noon the next business day.
    final_after_bdays: 1
    tags:
      curve:
        quality: "the Bank's OIS curve has monthly maturities, so a meeting's step is placed by interpolating between them; against the Bank's own MPR conditioning paths the path is within 1.0bp on average"
      calendar:
        lag: "scheduled MPC dates are treated as known on every date; the September 2022 meeting is listed on the 22nd, where it was moved to"

  # Everything update_data.py keeps cached, by source (sources/registry.py).
  sources:
    # London business days to publication: SONIA at 9:00 the next day; Bank Rate
    # in force on d was announced by noon on d at the latest. DEXUSUK (Fed business
    # days) is the H.10 noon New York rate: a market price, known on its day, though
    # FRED posts it a week at a time.
    daily:
      boe: {IUDSOIA: 1, IUDBEDR: 0}   # SONIA, Bank Rate
      fred: {DEXUSUK: 0}              # USD per GBP
    curves:
      boe: [OIS_SPOT, GLC_SPOT]       # OIS short end, gilt long end: each by noon the next business day

  path:
    start: "2009-08-03"
    n_meetings: 8
    # Pin today-until-the-next-meeting to the last SONIA fixing when it spans
    # fewer days than this. The curve's first node is one month, so a first
    # meeting inside it is always pinned (curves/forward.py) whatever this says.
    min_regime_days: 10
    # The last regime runs to the meeting after the n-th; where the calendar does
    # not have it yet, this many days past the n-th.
    tail_days: 45

  # Real-time macro inputs, from the ONS as it published them (sources/ons.py): the
  # revisions triangles for the labour market, CPI (never revised) with its release
  # days. Not ALFRED: its OECD copies of UK series run 22-25 days late and stopped in 2025.
  macro:
    source: ons
    history_start: "2009-01-01"
    series: [D7G7, MGSX]            # CPI 12-month rate; LFS unemployment rate 16+, SA (UNEM04)
    # Cross-checks on the LFS, never nowcast inputs (the ONS itself recommends reading
    # them alongside it): the claimant count level (CLA03) and PAYE payrolled employees.
    validation: [CLAIMANTS, PAYE]
    projections: []
    # First as_of: the first UNEM04 release, August 2010 (dated by rule: before the
    # ONS calendar starts in 2016 a release is dated the 26th, never early).
    start: "2010-08-26"
    inflation:
      rate: D7G7                    # CPI 12-month: the MPC's target, published, never revised
    gap:
      unemployment: MGSX            # three months ending the labelled month
      # No vintaged UK natural rate is machine-readable back to 2010 (OBR publishes one
      # per forecast, in its tables). Deferred (notes/DECISIONS.md, V8): u*
      # 0.5pp off moves the rule as r* 1pp off does, and the r* rows measure that.
      # A constant, like r*: the gap's z removes its trailing mean, so a constant moves
      # the bp level more than the trade.
      # 4.5: the Bank's own medium-term equilibrium, "around 4½%" (February 2025 MPR).
      natural_rate: {constant: 4.5}
    # Where each input's publication date or value is approximate, said once here;
    # report/brief.py builds the limitations footer from these, not by hand.
    report: labour                 # report/labour.py: the LFS read against the claimant count and PAYE
    labour:
      lfs: MGSX
      claimants: CLAIMANTS
      paye: PAYE
      suspended: ["2023-10-01", "2024-02-01"]   # no LFS release: shaded on the labour chart
    tags:
      D7G7:
        lag: "CPI release days before February 2016 are dated the 26th of the month (up to ~10 days late, never early)"
      MGSX:
        lag: "LFS release days before April 2016 are dated the 26th of the month (up to ~10 days late, never early)"
        quality: >-
          LFS unemployment is noisy after the 2023 response-rate collapse: suspended Oct 2023-Jan 2024
          (the last official vintage is held), "official statistics in development" Feb 2024-Aug 2026,
          volatile in mid-2023 and 2024, and a collection error in May-June 2026 degraded releases from July
      CLAIMANTS:
        quality: "claimant count is still 'official statistics in development'"
      PAYE:
        quality: "PAYE RTI vintages exist only from December 2019; not used before then"
      natural_rate:
        quality: "u* is a constant 4.5%, not a real-time estimate"
      rstar:
        quality: "r* is a constant (-1.6%, the 2009-26 average real Bank Rate): a hindsight number that moves the bp gap and mostly leaves the z unchanged, except near the floor"

  # The same rule as USD, imposed, with the Bank's own numbers where they differ.
  rule:
    policy_rate: {source: boe, series: [IUDBEDR]}   # Bank Rate: one rate, not a range
    inflation: infl_12m
    gap: u_gap
    inflation_target: 2.0
    coefficients: {inflation_gap: 0.5, unemployment_gap: 2.0}
    inertia: 0.85
    # Monthly meetings until 2015, eight a year from 2016 (2016 had eleven).
    meetings_per_quarter: [{from: "2009-01-01", value: 3}, {from: "2016-01-01", value: 2}]
    # The floor the MPC itself described: 0.5% until it cut to 0.25% in August 2016 and
    # said a cut to "close to, but a little above, zero" was possible; 0.1% from then (it
    # went there in March 2020 and never below). notes/DECISIONS.md.
    elb: [{from: "2009-01-01", value: 0.5}, {from: "2016-08-04", value: 0.1}]
    spread_fixings: 20
    # SONIA was reformed on 2018-04-23 (brokered to transaction-based): its spread to Bank
    # Rate is estimated only from fixings the same side of that date.
    spread_breaks: ["2018-04-23"]
    # No longer-run policy rate is published (no SEP), and the long end of the OIS curve
    # would make the model inherit market pricing. A constant: the 2009-08..2026-08
    # average of Bank Rate minus 12-month CPI, -1.59% (median -1.40). notes/DECISIONS.md.
    rstar: {constant: -1.6}
    tags:
      conditioning:
        quality: "hold-flat conditioning: inflation, the unemployment gap and r* stay at today's values at every meeting"
      rule:
        quality: "the rule is imposed from the Fed's Monetary Policy Report, not estimated"

  signal:
    window: 730D
    min_periods: 250
    sd_floor_bp: 5

  backtest:
    horizon: 4
    execution_lag: 1
    dv01: 1.0
    tags:
      costs:
        quality: "GBP costs are assumed, not observed: the OIS forward and the gilt legs are valued off the Bank's fitted curves, so no traded price gives a spread (1bp a round trip each)"

  # The expression layer: what each expression trades in this currency (strategy/instruments.py names the types).
  expression:
    outright:
      instrument: curve_forward      # a meeting-dated OIS forward off market.curve
      label: OIS forward             # "OIS forward 18 Mar-29 Apr 2027"
    curve:
      instrument: par_from_spot      # gilt par yields from the Bank's fitted nominal spot curve
      label: gilt                    # "2y gilt"
      source: boe
      series: GLC_SPOT               # one curve, keyed by tenor
      legs: [2, 10]                  # receive the first, pay the second, DV01-neutral
      coupons_per_year: 2
    fx: {source: fred, series: DEXUSUK, book_per_unit: true,   # USD per GBP: a GBP leg's P&L converts at it
         plausible: [1.0, 2.5]}   # USD per GBP, 1.07-1.72 since 2009: an inverted quote (0.58-0.93) is refused
    tags:
      curve_forward:
        modelling: "the outright is a meeting-dated OIS forward off the Bank's fitted curve, not a traded contract"
      GLC_SPOT:
        quality: "gilt legs are par yields from the Bank's fitted spot curve, not traded gilts; a missing 0.5y point is interpolated (at most 0.3bp on 2y par)"
      DEXUSUK:
        lag: "GBP legs convert at the H.10 noon New York rate, not the London close, carried over Fed holidays (132 of 4,063 GBP sessions)"
      funding:
        modelling: "a par leg is funded at the overnight rate, standing in for repo"
      convexity:
        modelling: "legs are DV01-linear, so the P&L leaves out convexity: under 3bp a year per unit DV01 on a 2s10s receive, 7bp at most (2022)"
  costs:                             # strategy/costs.py: round trip per leg and unit of DV01 traded, bp
    outright: {round_trip_bp: 1.0, observed: false}      # assumed: valued off a fitted curve, no traded price
    curve: {round_trip_bp: 1.0, observed: false, roll_every_months: 3}   # assumed; a held leg is re-struck quarterly
    tags:
      outright:
        modelling: "the OIS forward rolls to the next window each time the fourth meeting moves on, charged as two outright one-ways"
      curve:
        modelling: "a gilt leg's P&L is a constant-maturity bond re-struck daily; the cost charged is a desk's roll every three months while held"

  # Checks against the central bank's own published numbers (scripts/check_mpr.py).
  validation:
    conditioning:
      truth: tests/data/boe/conditioning_paths.csv   # the Bank's Projections Databank, taken once
      examples: ["August 2019", "February 2023", "August 2024"]

  report:
    labels: {market: OIS, rate: SONIA, rule: "The balanced-approach rule", policy: Bank Rate, meetings: MPC,
             bank: the Bank, inflation: CPI, policy_rate: Bank Rate,
             nowcast_start: "which starts with the first LFS revisions-triangle release",
             calendar: London,
             # LFS unemployment is a three-month average, labelled by its last month.
             unemployment_period: "for the three months to {month:%B}"}
    onepager: false
    annotate_from: "2021-12-01"
    moments:
      - ["2011-06-01", "CPI at 4.5%, Bank Rate held at 0.5%"]
      - ["2013-08-07", "Forward guidance"]
      - ["2016-06-24", "The day after the EU referendum"]
      - ["2017-11-02", "The first hike in a decade"]
      - ["2019-08-01", "Brexit uncertainty: cuts priced"]
      - ["2020-03-12", "The day after the emergency cut"]
      - ["2021-11-05", "The day after the November 2021 hold"]
      - ["2022-03-01", "CPI at 5.5%, Bank Rate 0.5%"]
      - ["2022-09-27", "The mini-budget: an emergency hike priced"]
      - ["2023-06-23", "The day after the 50bp hike to 5%"]
      - ["2023-12-01", "Peak rates"]
      - ["2024-08-02", "The day after the first cut"]
      - ["2025-06-02", "Gradual cuts"]
    chart_moments:
      - ["2016-06-01", "2016-09-30", "Referendum"]
      - ["2021-10-01", "2022-03-31", "Rule up, Bank waits"]
      - ["2022-09-15", "2022-11-15", "Mini-budget"]
      - ["2024-07-01", "2024-09-30", "Cuts begin"]
