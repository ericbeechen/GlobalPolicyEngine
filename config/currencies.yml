# Currency-specific behaviour. Modules read this; they never branch on currency.
# Adding a currency should need only a block here and a meetings file.

USD:
  enabled: true
  meetings: fomc.csv            # under config/meetings/
  history_start: "2016-01-01"   # first fixing pulled into the cache

  # The overnight rate the policy futures settle on.
  overnight:
    source: fred
    series: EFFR
  # Monthly-average futures the policy path is solved from.
  policy_futures: ZQ

  # Everything update_data.py keeps cached.
  fred_series: [EFFR, SOFR, DFEDTARL, DFEDTARU]
  futures_roots: [ZQ, SR3]

  path:
    start: "2021-01-01"         # first session in the panel
    n_meetings: 8               # solve and report this many upcoming meetings
    # Both chosen from the full panel; see notes/decisions.md (2026-09-24).
    # Pin today-until-the-next-meeting to the last fixing when it spans fewer
    # days than this: below 10, one contract's noise is amplified more than 3x.
    min_regime_days: 10
    # Drop the front contract when it has fewer unknown days left than this.
    # 0 = never: once short regimes are pinned, dropping it gains nothing, and
    # without pinning it only moved the amplification into the next contract.
    min_forward_days: 0

  # Secondary overnight index: the discount curve and the SR3 cross-check.
  sofr:
    source: fred
    series: SOFR
    futures: SR3
    day_count: Actual360
    curve_years: 3              # SR3 contracts used out to this many years
      # Real-time macro inputs. Every series is pulled with its full ALFRED vintage
  # history; reports/vintages_USD.md says what each one covers.
  macro:
    source: alfred
    history_start: "1990-01-01"   # reference dates pulled: moments and bridge fits need history
    series: [PAYEMS, INDPRO, RSAFS, CPIAUCSL, NEWORDER, UNRATE, NROU,
             PCEPILFE, CPILFESL, CES0500000003]
    validation: [CPILFENS, GDPNOW, UNRATEMDLR]   # pulled and tested, never a nowcast input
    projections: [NROU]           # published ahead of the dates they describe
    inflation:
      target: PCEPILFE            # what the rule reacts to
      bridge: CPILFESL            # prints ~2 weeks earlier; stands in until the target arrives
      bridge_window: 60           # months of overlap the bridge is fitted on
      wages: CES0500000003
    gap:
      unemployment: UNRATE
      natural_rate: NROU          # CBO, vintaged; see notes/macro.md
    activity:
      series: [PAYEMS, INDPRO, RSAFS, NEWORDER]   # first sets the quarter: it prints first
      deflate: {RSAFS: CPIAUCSL}  # real retail sales built as-of, not FRED's RRSFS
      moments_start: "1993-01-01" # NEWORDER starts 1992-02; first complete q/q is 1993Q1
      min_series: 3
